<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caçadores da História</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="ra3d.js"></script>
<style>
/* =====================================================================
   Sistema de design — Caçadores da História
   R7: contraste ≥ 7:1 (branco e dourado sobre fundo escuro; texto escuro sobre dourado)
   R13: tudo em rem, para respeitar o tamanho de letra do sistema
   Alvos de toque ≥ 48 px (3 rem). Um só destaque de cor: o dourado.
   ===================================================================== */
:root{
  --bg:#0B1016; --bg2:#121A23; --sup:#18222D; --sup2:#223040; --linha:#2E3F52;
  --fg:#FFFFFF; --fg2:#C9D4DF; --ouro:#FFC93C; --ouro2:#FFDE7A; --tinta:#0B1016;
  --ok:#5BE38A; --erro:#FF8A80; --azul:#8CCBFF;
  --r:1rem; --alvo:3rem; --sombra:0 .5rem 1.5rem rgba(0,0,0,.45);
  --amarelo:var(--ouro);
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;line-height:1.45;overscroll-behavior:none;
  background:radial-gradient(120% 60% at 50% 0%,#1A2634 0%,var(--bg) 60%) fixed}
#app{min-height:100vh}
.ecra{max-width:34rem;margin:0 auto;padding:1rem 1rem 5rem;animation:entra .25s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(.4rem)}}
h1{font-size:2rem;line-height:1.1;margin:.4rem 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.45rem;line-height:1.2;margin:.4rem 0 .6rem}
h3{font-size:1.1rem;margin:1.2rem 0 .4rem;color:var(--fg2);font-weight:700}
p{margin:.5rem 0}
.sub{color:var(--ouro);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem}
.nota{font-size:.95rem;color:var(--fg2)}
.i{width:1.3em;height:1.3em;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.i.cheio{fill:currentColor;stroke:none}

/* botões */
button,.btn{font:inherit;font-weight:800;min-height:var(--alvo);min-width:var(--alvo);padding:.75rem 1.1rem;border-radius:.9rem;
  border:2px solid var(--linha);background:var(--sup);color:var(--fg);cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;transition:transform .08s,background .15s,border-color .15s}
button:active:not(:disabled){transform:scale(.97)}
button:hover:not(:disabled){border-color:#4A6178}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
.prim{background:var(--ouro);color:var(--tinta);border-color:var(--ouro);box-shadow:0 .3rem 0 #B8860B}
.prim:hover:not(:disabled){background:var(--ouro2);border-color:var(--ouro2)}
.larga{width:100%;margin:.55rem 0}
.grande{min-height:3.8rem;font-size:1.2rem;border-radius:1.1rem}
.btn-volta,.icbtn{background:transparent;border-color:transparent;padding:.5rem .6rem;color:var(--fg)}
.icbtn{width:var(--alvo);height:var(--alvo);padding:0;border-radius:50%;background:rgba(255,255,255,.08)}
button:disabled{opacity:.4;cursor:not-allowed}
.linha{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.linha>*{flex:1 1 auto}

/* superfícies */
.caixa{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:1rem;margin:.9rem 0}
.caixa.amarela{border:2px solid var(--ouro)}
.appbar{display:flex;align-items:center;gap:.4rem;min-height:3.2rem;margin:-.2rem -.4rem .4rem}
.appbar h2{margin:0;font-size:1.2rem;flex:1}
label{display:block;font-weight:700;margin:1rem 0 .35rem;color:var(--fg2)}
input[type=text],textarea{font:inherit;width:100%;min-height:var(--alvo);padding:.7rem .9rem;border-radius:.8rem;border:2px solid var(--linha);background:var(--bg2);color:var(--fg)}
input[type=text]:focus,textarea:focus{border-color:var(--ouro)}
.escolha{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.5rem}
.escolha button{background:var(--bg2)}
.escolha button[aria-pressed=true]{background:var(--ouro);color:var(--tinta);border-color:var(--ouro)}
.papel{display:inline-flex;align-items:center;gap:.35rem;background:var(--ouro);color:var(--tinta);font-weight:900;border-radius:999px;padding:.25rem .8rem;font-size:.9rem}
.barra-topo{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--linha);background:var(--sup);border-radius:999px;padding:.3rem .8rem;font-weight:800;white-space:nowrap}
.barra-prog{height:.6rem;border-radius:999px;background:var(--bg2);overflow:hidden;margin:.6rem 0}
.barra-prog i{display:block;height:100%;background:var(--ouro);border-radius:999px}
.estrelas{display:inline-flex;gap:.15rem;color:var(--ouro)}.estrelas .vazia{color:#4A5A6B}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;border-radius:50%;font-weight:900;color:var(--tinta);flex:none}
.avatar.g{width:4.5rem;height:4.5rem;font-size:2rem}

/* ecrã título */
.titulo{position:relative;min-height:100vh;display:flex;flex-direction:column;max-width:34rem;margin:0 auto;padding:1rem 1rem calc(1.5rem + env(safe-area-inset-bottom))}
.titulo .topo{display:flex;justify-content:space-between;align-items:center;gap:.5rem;position:relative;z-index:2}
.chip-conta{display:inline-flex;align-items:center;gap:.55rem;background:rgba(255,255,255,.08);border:1px solid var(--linha);border-radius:999px;padding:.25rem .9rem .25rem .3rem;font-weight:800;min-height:var(--alvo)}
.heroi{position:relative;flex:1;min-height:16rem;margin:.5rem -1rem 0;display:flex;align-items:center;justify-content:center}
.heroi img{width:78%;max-width:22rem;filter:drop-shadow(0 1.2rem 1.5rem rgba(0,0,0,.6))}
.heroi canvas{border-radius:0}
.marca{text-align:center;position:relative;z-index:2}
.marca h1{font-size:2.4rem;margin:.2rem 0}
.marca p{color:var(--fg2);margin:0 0 1.2rem}

/* folha (painel inferior) de definições e pausa */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.folha{background:var(--bg2);width:100%;max-width:34rem;border-radius:1.4rem 1.4rem 0 0;padding:.6rem 1rem calc(1rem + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:sobe .25s ease-out;border-top:1px solid var(--linha)}
@keyframes sobe{from{transform:translateY(100%)}}
.folha .pega{width:2.6rem;height:.3rem;border-radius:999px;background:var(--linha);margin:.2rem auto .6rem}
.item{display:flex;align-items:center;gap:.8rem;width:100%;justify-content:flex-start;text-align:left;background:transparent;border:0;border-radius:.8rem;padding:.8rem .5rem;font-weight:700}
.item:hover{background:var(--sup)}
.item .txt{flex:1}.item .dir{color:var(--fg2);font-weight:600}
.sep{height:1px;background:var(--linha);margin:.4rem 0}
.interruptor{position:relative;width:3.2rem;height:1.9rem;border-radius:999px;background:#3A4A5C;flex:none;transition:background .15s}
.interruptor::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;transition:left .15s}
[aria-checked=true] .interruptor{background:var(--ouro)}[aria-checked=true] .interruptor::after{left:1.5rem}
.passos-letra{display:flex;align-items:center;gap:.4rem}

/* níveis */
.nivel{display:grid;grid-template-columns:5.5rem 1fr;gap:.9rem;align-items:center;background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:.8rem;margin:.8rem 0}
.nivel.ativo{border:2px solid var(--ouro)}
.nivel .mini{aspect-ratio:1;border-radius:.8rem;background:linear-gradient(#2a6fb0,#1f5fa8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.nivel .mini img{width:92%}
.nivel.bloq{opacity:.55}.nivel.bloq .mini{background:var(--bg2);color:var(--fg2)}
.nivel h2{font-size:1.15rem;margin:.1rem 0}
.nivel .acoes{grid-column:1/-1}

/* ---------- Procurar (câmara) ---------- */
.cam{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;user-select:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pano{position:absolute;inset:0;background:linear-gradient(#5aa9e6 0 38%,transparent 38%),repeating-linear-gradient(90deg,#d8bb84 0 60px,#c9a96f 60px 62px),#c9a96f}
.pano::before{content:"";position:absolute;left:0;right:0;top:30%;height:9%;background:repeating-linear-gradient(90deg,#d8bb84 0 34px,transparent 34px 56px)}
.pano::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:#8a6a43}
.peca-ra{position:absolute;top:42%;width:7rem;height:7rem;margin:-3.5rem 0 0 -3.5rem;display:flex;align-items:center;justify-content:center;border-radius:1.2rem;transition:transform .15s;animation:flutua 2.4s ease-in-out infinite;pointer-events:none}
.peca-ra img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 3px #000) drop-shadow(0 0 2px #000)}
#mundo.tem3d .peca-ra img{opacity:0}
#mundo.tem3d .peca-ra{animation:none;top:50%}
#mundo.tem3d .peca-ra.encontrada{background:transparent}
.peca-ra.encontrada{pointer-events:auto;transform:scale(1.6);background:rgba(0,0,0,.5);outline:4px solid var(--ouro);outline-offset:4px;cursor:pointer;animation:none}
@keyframes flutua{50%{translate:0 -10px}}
.hud{position:absolute;top:max(.8rem,env(safe-area-inset-top));left:.8rem;right:8rem;display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.hud .pill,.info-topo .pill{background:rgba(11,16,22,.85);border-color:rgba(255,255,255,.25)}
.info-topo{position:absolute;top:max(.8rem,env(safe-area-inset-top));left:.8rem;right:8rem;display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.radar{position:absolute;top:max(.8rem,env(safe-area-inset-top));right:.8rem;width:6.5rem;height:6.5rem;border-radius:50%;background:rgba(11,16,22,.82);border:2px solid rgba(255,255,255,.7)}
.radar::before{content:"";position:absolute;left:50%;top:0;bottom:50%;border-left:2px dashed rgba(255,255,255,.5)}
.radar .eu{position:absolute;left:50%;top:50%;width:.9rem;height:.9rem;margin:-.45rem;border-radius:50%;background:#fff}
.radar .alvo{position:absolute;left:50%;top:50%;width:1.3rem;height:1.3rem;margin:-.65rem;border-radius:50%;background:var(--ouro);border:3px solid var(--tinta)}
.dica{position:absolute;left:50%;bottom:calc(6.6rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(11,16,22,.9);border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:900;font-size:1.25rem;padding:.55rem 1.1rem;border-radius:999px;white-space:nowrap;text-align:center}
.dica.quente{border-color:var(--ouro);color:var(--ouro)}
.calor{width:10rem;max-width:100%;height:.6rem;border-radius:999px;background:rgba(11,16,22,.85);border:1px solid rgba(255,255,255,.3);overflow:hidden}
.calor i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--azul),var(--ouro),#ff6a3d)}
.rodar{position:absolute;top:50%;transform:translateY(-50%);background:rgba(11,16,22,.82);border-color:rgba(255,255,255,.3);border-radius:50%;width:3.4rem;height:3.4rem;padding:0}
.rodar.esq{left:.5rem}.rodar.dir{right:.5rem}
.fundo-cam{position:absolute;left:0;right:0;bottom:0;padding:.5rem .5rem calc(.5rem + env(safe-area-inset-bottom));display:flex;gap:.35rem;background:linear-gradient(transparent,rgba(11,16,22,.95) 35%)}
.fundo-cam button{flex:1;flex-direction:column;gap:.15rem;padding:.4rem .2rem;font-size:.8rem;background:rgba(24,34,45,.92);border-color:rgba(255,255,255,.15);border-radius:.9rem;min-height:3.6rem}
.fundo-cam button .i{width:1.5rem;height:1.5rem}
.fundo-cam button.prim{background:var(--ouro);color:var(--tinta)}
.aviso-cam{position:absolute;left:.8rem;right:.8rem;top:8.8rem;background:rgba(11,16,22,.9);border:1px solid rgba(255,255,255,.3);border-radius:.8rem;padding:.6rem .8rem;font-size:.95rem}

/* ---------- Curiosidade / pergunta ---------- */
.peca-grande{position:relative;width:100%;height:13rem;margin:.3rem auto;display:flex;justify-content:center;border-radius:var(--r);background:radial-gradient(circle at 50% 60%,#25415E,transparent 70%)}
.peca-grande img{width:13rem;height:100%;object-fit:contain}
.vista3d{position:relative;background:linear-gradient(#2a6fb0,#9fd0f5)}
.dica3d{position:absolute;left:.6rem;bottom:.6rem;background:rgba(11,16,22,.85);color:#fff;font-weight:800;font-size:.85rem;padding:.25rem .7rem;border-radius:999px;pointer-events:none}
.legenda{font-size:1.15rem;background:var(--sup);border-left:5px solid var(--ouro);padding:.9rem 1rem;border-radius:.6rem;line-height:1.5}
.opcoes{display:grid;gap:.7rem;margin-top:1rem}
.opcoes button{font-size:1.2rem;justify-content:flex-start;text-align:left;min-height:4rem;background:var(--sup)}
.opcoes button.certa{background:var(--ok);color:var(--tinta);border-color:var(--ok)}
.opcoes button.errada{background:var(--erro);color:var(--tinta);border-color:var(--erro)}
.retro{font-size:1.3rem;font-weight:900;margin-top:1rem}

/* ---------- Montar ---------- */
.tabuleiro{position:relative;width:100%;margin:0 auto;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#1f5fa8;box-shadow:var(--sombra)}
.tabuleiro>.fundo{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute}
.slot img{width:100%;height:100%;display:block}
.slot.vazio img{opacity:.35;filter:grayscale(1) brightness(.6)}
.slot.vazio{outline:2px dashed var(--ouro);outline-offset:1px;border-radius:.3rem}
.slot.encaixa{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.mochila{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.6rem;margin-top:.4rem}
.mpeca{aspect-ratio:1;border:2px solid var(--linha);border-radius:.9rem;display:flex;align-items:center;justify-content:center;padding:.4rem;background:var(--sup);touch-action:none;cursor:grab;position:relative}
.mpeca img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.mpeca.bloq{border-style:dashed;color:var(--fg2);font-size:1.4rem;cursor:default;background:transparent}
.mpeca small{position:absolute;bottom:.2rem;right:.25rem;display:flex;background:var(--bg);border-radius:.5rem;padding:.1rem;color:var(--fg2)}
.mpeca small .i{width:1.1rem;height:1.1rem}
.mpeca.pronta{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.mpeca.pronta small{color:var(--ok)}
.fantasma{position:fixed;pointer-events:none;z-index:50;opacity:.92;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.fantasma img{width:100%;height:100%;display:block}
.legenda-ic{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .8rem}
.legenda-ic span{border:1px solid var(--linha);background:var(--sup);border-radius:999px;padding:.2rem .7rem;font-size:.9rem;color:var(--fg2)}
.slot.alvo{outline:3px solid var(--ouro);animation:piscar .8s infinite}
@keyframes piscar{50%{outline-color:transparent;background:rgba(255,201,60,.4)}}
.slot.iman{outline:3px solid var(--ok)!important;background:rgba(91,227,138,.4);animation:none}
.slot.quase{outline:3px solid var(--erro)!important;animation:none}

/* ---------- Sem RA ---------- */
.local{display:grid;grid-template-columns:5.5rem 1fr;gap:.9rem;align-items:center;background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:.7rem;margin:.7rem 0}
.local .foto{aspect-ratio:1;background:linear-gradient(#2a6fb0,#1f5fa8);border-radius:.7rem;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.local .foto img,#pg img{width:100%;height:100%;object-fit:contain}

/* ---------- Professora / dados ---------- */
.codigo{font-size:2.4rem;font-weight:900;letter-spacing:.15em;text-align:center;color:var(--ouro);border:2px dashed var(--ouro);border-radius:var(--r);padding:.6rem}
table{width:100%;border-collapse:collapse;font-size:.95rem;background:var(--sup);border-radius:.8rem;overflow:hidden}
th,td{border-bottom:1px solid var(--linha);padding:.55rem .6rem;text-align:left}
th{background:var(--sup2);color:var(--fg2);font-weight:700}
.qr{background:#fff;padding:.8rem;border-radius:var(--r);width:min(17rem,78vw);margin:1rem auto}
.qr svg{width:100%;height:auto;display:block}
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}
.escala button{padding:.3rem;font-size:1.1rem;background:var(--bg2)}
.escala button[aria-pressed=true]{background:var(--ouro);color:var(--tinta);border-color:var(--ouro)}
.ok{color:var(--ok);font-weight:900}.nok{color:var(--erro);font-weight:900}
.destaque{font-size:1.3rem;font-weight:900;color:var(--ouro)}
.estado{display:inline-block;min-width:4.2rem;text-align:center;border-radius:999px;padding:.1rem .5rem;font-size:.8rem;font-weight:900;margin-right:.5rem}
.estado.s{background:var(--ok);color:var(--tinta)}.estado.n{background:var(--erro);color:var(--tinta)}.estado.a{background:var(--sup2);color:var(--fg)}

/* ---------- Passar o telemóvel ---------- */
.passa{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;max-width:30rem;margin:0 auto;padding:1.5rem}
.ic-grande{width:6rem;height:6rem;border-radius:50%;background:var(--sup);border:2px solid var(--ouro);color:var(--ouro);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.ic-grande .i{width:3rem;height:3rem}

/* ---------- Significantes de jogo: pegadas, setas, mão ---------- */
.xr-ov{position:fixed;inset:0;z-index:40;pointer-events:none;color:#fff}
.xr-ov button{pointer-events:auto}
.pegadas{position:absolute;left:50%;bottom:calc(10.4rem + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:.8rem;pointer-events:none}
.pegadas span{display:flex;opacity:.15;animation:passo 1.2s infinite}
.pegadas .i{width:2.4rem;height:2.4rem}
.pegadas span:nth-child(2){animation-delay:.3s}.pegadas span:nth-child(3){animation-delay:.6s}
@keyframes passo{30%{opacity:1}65%{opacity:.15}}
.pegadas.dir span{rotate:90deg}
.pegadas.esq{flex-direction:row-reverse}.pegadas.esq span{rotate:-90deg}
.pegadas.frente{flex-direction:column-reverse;gap:.1rem}
.pegadas.oculta,.seta-lado.oculta{display:none}
.seta-lado{position:absolute;top:42%;color:var(--ouro);pointer-events:none;animation:empurra 1s infinite;filter:drop-shadow(0 0 3px #000) drop-shadow(0 0 2px #000)}
.seta-lado .i{width:4rem;height:4rem;stroke-width:3}
.seta-lado.dir{right:4.2rem}.seta-lado.esq{left:4.2rem;animation-name:empurraE}.seta-lado.esq .i{transform:scaleX(-1)}
@keyframes empurra{50%{translate:12px 0}}@keyframes empurraE{50%{translate:-12px 0}}
.pe{fill:var(--ouro);stroke:var(--tinta);stroke-width:1.2}
.maoi{fill:#fff;stroke:var(--tinta);stroke-width:1.3;stroke-linejoin:round}
.mao{display:none;position:absolute;right:-1.4rem;bottom:-1.8rem;pointer-events:none;animation:toque 1s infinite}
.mao .i{width:2.8rem;height:2.8rem;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.peca-ra.encontrada .mao,.mao.ver{display:block}
@keyframes toque{50%{transform:translate(-6px,-12px) scale(.88)}}
.passo-ic{display:grid;grid-template-columns:3.4rem 1fr;gap:.9rem;align-items:center;border-bottom:1px solid var(--linha);padding:.7rem 0}
.passo-ic .ic{width:3.2rem;height:3.2rem;border-radius:.9rem;background:var(--sup);display:flex;align-items:center;justify-content:center;color:var(--ouro)}
.passo-ic .ic .i{width:1.9rem;height:1.9rem}
.passo-ic b{font-size:1.08rem;display:block}
.mao-demo{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:4.5rem;height:4.5rem}
.mao-demo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
.mao-demo span{position:absolute;right:-1.2rem;bottom:-1.4rem}.mao-demo span .i{width:2.6rem;height:2.6rem}
/* demonstração "como pegar numa peça" */
.demo-ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.demo-cx{background:var(--bg2);border-radius:1.4rem 1.4rem 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));max-width:34rem;width:100%;max-height:92vh;overflow:auto;animation:sobe .25s ease-out;border-top:1px solid var(--linha)}
.demo-tel{width:10rem;height:14rem;margin:.4rem auto;border:5px solid #E8EEF4;border-radius:1.4rem;position:relative;overflow:hidden;background:linear-gradient(#5aa9e6 0 40%,#d8bb84 40% 75%,#8a6a43 75%);animation:telRoda 4.5s infinite ease-in-out}
.demo-peca{position:absolute;top:30%;left:85%;width:4.4rem;height:4.4rem;margin-left:-2.2rem;border-radius:.6rem;animation:pecaVem 4.5s infinite ease-in-out}
.demo-peca img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 2px #000)}
.demo-mao{position:absolute;top:52%;left:56%;opacity:0;animation:maoToca 4.5s infinite}.demo-mao .i{width:2.6rem;height:2.6rem}
.demo-radar{position:absolute;top:.4rem;right:.4rem;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(11,16,22,.8);border:2px solid #fff}
.demo-radar i{position:absolute;left:50%;top:50%;width:.7rem;height:.7rem;margin:-.35rem;border-radius:50%;background:var(--ouro);animation:radarVem 4.5s infinite ease-in-out}
.demo-passos{padding-left:0;list-style:none;margin:.6rem 0}
.demo-passos li{font-size:1.05rem;padding:.45rem .7rem;border-radius:.7rem;margin:.2rem 0;opacity:.4}
.demo-passos li:nth-child(1){animation:passo1 4.5s infinite}.demo-passos li:nth-child(2){animation:passo2 4.5s infinite}.demo-passos li:nth-child(3){animation:passo3 4.5s infinite}
@keyframes telRoda{0%{rotate:12deg}45%,100%{rotate:0deg}}
@keyframes pecaVem{0%{left:85%;transform:scale(1);outline:0 solid transparent}45%{left:50%;transform:scale(1);outline:0 solid transparent}55%,88%{left:50%;transform:scale(1.25);outline:4px solid #FFC93C;outline-offset:3px}92%,100%{left:50%;transform:scale(.2);opacity:0}}
@keyframes maoToca{0%,55%{opacity:0;transform:none}62%{opacity:1;transform:none}72%{opacity:1;transform:translate(-6px,-12px) scale(.85)}80%,88%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes radarVem{0%{transform:translate(.8rem,-.4rem)}45%,100%{transform:translate(0,-.75rem)}}
@keyframes passo1{0%,42%{opacity:1;background:var(--sup2)}48%,100%{opacity:.4;background:none}}
@keyframes passo2{0%,44%{opacity:.4;background:none}48%,60%{opacity:1;background:var(--sup2)}64%,100%{opacity:.4;background:none}}
@keyframes passo3{0%,60%{opacity:.4;background:none}64%,95%{opacity:1;background:var(--sup2)}100%{opacity:.4}}

.toast{position:fixed;left:50%;top:max(1rem,env(safe-area-inset-top));transform:translateX(-50%);z-index:100;background:var(--fg);color:var(--tinta);font-weight:800;padding:.7rem 1.2rem;border-radius:999px;box-shadow:var(--sombra);max-width:90vw;text-align:center;animation:entra .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let actx=null;
function som(tipo){
  if(!DEF.som)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notas={encontrar:[[880,.09],[1320,.12]],certo:[[660,.1],[990,.18]],errado:[[260,.25]],encaixe:[[520,.06],[780,.08]],fim:[[523,.12],[659,.12],[784,.12],[1046,.3]]}[tipo]||[[600,.1]];
    let t=actx.currentTime;
    for(const [f,d] of notas){const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.9}
  }catch(e){}
}

  pararVoz();

  const u=new SpeechSynthesisUtterance(texto);u.lang="pt-PT";u.rate=.95;

  u.onend=()=>fim&&fim();u.onerror=()=>fim&&fim();
  speechSynthesis.speak(u);
}

function entrar(id,pinOk){
  const c=CONTAS.lista[id];
  if(c.pin&&!pinOk){
    app.innerHTML=`<main class="ecra" style="text-align:center;padding-top:2rem">${barraApp("","vt")}${avatar(c,true)}<h2>${esc(c.alcunha)}</h2>

      <button class="prim larga" id="ok">Entrar</button></main>`;
    const i=document.getElementById("pin");i.focus();
    const ok=async()=>{if(await hashPin(i.value)===c.pin)entrar(id,true);else{toast("PIN errado. Tenta outra vez.");i.value="";vibrar(150)}};
    document.getElementById("ok").onclick=ok;i.onkeydown=e=>{if(e.key==="Enter")ok()};
    document.getElementById("vt").onclick=escolherConta;return;
  }
  CONTAS.ativa=id;c.usada=Date.now();gravarContas();CONVIDADO=false;
  J=nivelDe(c).jogo;inicio();
  toast(`Olá, ${c.alcunha}!${emCurso()?" Podes continuar onde paraste.":""}`);
}
function criarConta(){
  let cor=CORES[Math.floor(Math.random()*CORES.length)];
  const des=()=>{
    const al=(document.getElementById("al")||{}).value||"", pin=(document.getElementById("pin")||{}).value||"";
    app.innerHTML=`<main class="ecra">
      ${barraApp("Criar conta","vt")}
      <div style="text-align:center">${avatar({alcunha:al||"?",avatar:cor},true)}</div>
      <label for="al">Alcunha</label>
      <input type="text" id="al" maxlength="16" autocomplete="off" placeholder="Ex.: Kiki" value="${esc(al)}">
      <p class="nota">Não escrevas o nome completo.</p>
      <label>Cor</label>
      <div class="escolha" style="grid-template-columns:repeat(8,1fr)">${CORES.map(x=>`<button data-a="${x}" aria-pressed="${x===cor}" aria-label="Cor ${x}" style="background:${x};border-color:${x===cor?"#fff":x};min-width:0;padding:0;height:2.8rem"></button>`).join("")}</div>
      <label for="pin">PIN de 4 números (opcional)</label>
      <input type="text" id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Para telemóveis partilhados" value="${esc(pin)}">
      <p class="nota">O PIN só evita que um colega entre na tua conta por engano. Não uses o PIN do banco.</p>
      <button class="prim larga grande" id="ok">Criar e jogar</button></main>`;
    document.getElementById("al").oninput=e=>{const a=document.querySelector(".avatar.g");if(a)a.textContent=([...e.target.value.trim()][0]||"?").toUpperCase()};
    document.getElementById("vt").onclick=()=>CONVIDADO?inicio():escolherConta();
    document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{cor=b.dataset.a;des()});
    document.getElementById("ok").onclick=async()=>{
      const al=document.getElementById("al").value.trim(), pin=document.getElementById("pin").value.trim();
      if(!al){toast("Escreve uma alcunha.");document.getElementById("al").focus();return}
      if(Object.values(CONTAS.lista).some(c=>c.alcunha.toLowerCase()===al.toLowerCase())){toast("Já existe uma conta com essa alcunha.");return}
      if(pin&&!/^\d{4}$/.test(pin)){toast("O PIN tem de ter 4 números, ou ficar vazio.");return}
      const id="c"+Date.now().toString(36);
      CONTAS.lista[id]={alcunha:al,avatar:cor,pin:pin?await hashPin(pin):null,criada:Date.now(),usada:Date.now(),historico:[]};
      // se estava a jogar sem conta, o jogo em curso passa para a conta nova
      if(CONVIDADO&&J)nivelDe(CONTAS.lista[id]).jogo=J;
      CONTAS.ativa=id;CONVIDADO=false;gravarContas();J=nivelDe(CONTAS.lista[id]).jogo;
      toast(`Conta criada. Olá, ${al}!`);inicio();
    };
  };
  des();
}

function retomar(){
  const falta=PECAS.find(p=>J.pecas[p.id].recolhida&&!J.pecas[p.id].respondida);
  if(falta)return passar(J.familia?"conta":"responde",()=>curiosidade(falta));
  if(contar("recolhida")===PECAS.length)return passar("monta",montar);
  passar("aponta",procurar);
}

      <div class="escolha" role="group">
        <button data-e="grande" aria-pressed="${espaco==="grande"}">Pátio ou espaço aberto</button>

      <p class="nota">Joga-se <b>de pé, a andar</b>: as peças ficam escondidas à volta, a alguns metros. Segue as pegadas e chega perto para as apanhar.</p>`

      <button class="prim larga grande" id="comecar" style="margin-top:1rem">${I("play")}Começar</button></main>`;
    document.getElementById("volta").onclick=inicio;

    document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{guardaCampos();espaco=b.dataset.e;desenhar();repoeCampos()});
    document.getElementById("comecar").onclick=async()=>{
      const nomes=[...Array(n==="f"?2:n)].map((_,i)=>document.getElementById("al"+i).value.trim());
      if(nomes.some(x=>!x)){toast("Escreve uma alcunha para cada jogador.");document.getElementById("al"+nomes.findIndex(x=>!x)).focus();return}
      const turma=document.getElementById("turma").value.trim().toUpperCase();
      // iOS: pedir acesso ao giroscópio tem de ser feito dentro do toque
      if(modo==="ra"&&window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}
      try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
      novoJogo(nomes,turma,modo,n==="f");
      // modo principal: andar com as peças pousadas no chão real (WebXR), se o telemóvel o suportar

/* ---------------- Ecrã 1 e 2: procurar e encontrar (RA por orientação) ---------------- */
let cam={stream:null,raf:0,tick:0,ouvinte:null};
function pararCamara(){
  cancelAnimationFrame(cam.raf);clearInterval(cam.tick);
  document.querySelectorAll(".demo-ov").forEach(e=>e.remove());
  if(cam.cena3d)cam.cena3d.parar();
  if(cam.ouvinte)window.removeEventListener("deviceorientation",cam.ouvinte);
  if(cam.teclas)window.removeEventListener("keydown",cam.teclas);
  if(cam.stream)cam.stream.getTracks().forEach(t=>t.stop()); // D2: câmara só enquanto se procura
  cam={stream:null,raf:0,tick:0,ouvinte:null};
  try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
}
function procurar(){
  if(J.modo==="semra")return semRA();
  pararCamara();
  const faltam=PECAS.filter(p=>!J.pecas[p.id].recolhida);
  if(!faltam.length)return passar("monta",montar);
  if(J.xr&&window.RA3D&&RA3D.xr)return iniciarXR(); // RA no chão (WebXR), se foi escolhida
  const FOV=60;
  app.innerHTML=`<div class="cam" id="cam">
    <div class="pano" id="pano"></div>
    <video id="vid" playsinline muted autoplay></video>
    <div id="tres" style="position:absolute;inset:0;pointer-events:none"></div>
    <div id="mundo">${faltam.map(p=>`<div class="peca-ra" data-id="${p.id}" role="button" aria-label="${esc(p.nome)}">${svgPeca(p.id)}<span class="mao" aria-hidden="true">${I("mao")}</span></div>`).join("")}</div>
    <div class="info-topo">
      <span class="pill">${I("mochila")}${contar("recolhida")}/${PECAS.length}</span>
      ${etiquetaPapel("aponta")}
      <div class="calor" aria-hidden="true"><i id="calor"></i></div>
    </div>
    <div class="radar" aria-hidden="true"><div class="eu"></div><div class="alvo" id="alvo"></div></div>
    <div class="aviso-cam" id="aviso" hidden></div>
    <button class="rodar esq" id="re" aria-label="Rodar para a esquerda" hidden>${I("voltar")}</button>
    <button class="rodar dir" id="rd" aria-label="Rodar para a direita" hidden>${I("seta")}</button>
    <div class="seta-lado oculta" id="seta" aria-hidden="true">${I("seta2")}</div>
    <div class="pegadas oculta" id="pegadas" aria-hidden="true">${PEGADAS}</div>
    <div class="dica" id="dica" role="status" aria-live="polite">Roda devagar…</div>
    <div class="fundo-cam">
      <button id="bmenu">${I("pausa")}Pausa</button>
      <button id="bexemplo">${I("ajuda")}Ajuda</button>
      <button id="bfixar" hidden>${I("pino")}Fixar</button>
      <button id="bxr" class="prim" hidden>${I("cubo")}RA no chão</button>
      <button id="bmontar">${I("grelha")}Montar (${contar("recolhida")-contar("colocada")})</button>
    </div></div>`;
  const $=id=>document.getElementById(id);
  const vid=$("vid"),pano=$("pano"),dica=$("dica"),alvo=$("alvo"),calor=$("calor");
  let rumo=0, alvoRumo=0, base=null, giroscopio=false, fixado=null, perto=0, encontrada=null, ultimaDica="";

  // Câmara traseira (se houver). Sem câmara → fundo desenhado.
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})
      .then(s=>{cam.stream=s;vid.srcObject=s;pano.hidden=true})
      .catch(()=>aviso("Sem acesso à câmara: a jogar com o fundo desenhado. Podes mudar para \"Sem câmara\" no menu."));
  } else aviso("Este aparelho não dá acesso à câmara aqui (é preciso https). A jogar com o fundo desenhado.");
  function aviso(t){const a=$("aviso");a.textContent=t;a.hidden=false;setTimeout(()=>a.hidden=true,6000)}

  // Giroscópio: rodar o corpo com o telemóvel apontado (interacção 1)
  cam.ouvinte=e=>{
    let h=typeof e.webkitCompassHeading==="number"?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);
    if(h==null)return;
    if(!giroscopio){giroscopio=true;$("re").hidden=$("rd").hidden=true}
    if(base==null)base=h;
    alvoRumo=norm(h-base);
  };
  window.addEventListener("deviceorientation",cam.ouvinte);
  // Sem giroscópio (computador): setas, arrastar ou teclado
  setTimeout(()=>{if(!giroscopio){$("re").hidden=$("rd").hidden=false}},900);
  $("re").onclick=()=>alvoRumo-=20; $("rd").onclick=()=>alvoRumo+=20;
  cam.teclas=e=>{if(e.key==="ArrowLeft")alvoRumo-=10;if(e.key==="ArrowRight")alvoRumo+=10};
  window.addEventListener("keydown",cam.teclas);
  let arrasto=null;
  $("cam").addEventListener("pointerdown",e=>{if(!giroscopio&&!e.target.closest("button,.peca-ra"))arrasto=e.clientX});
  $("cam").addEventListener("pointermove",e=>{if(arrasto!=null){alvoRumo-=(e.clientX-arrasto)*.25;arrasto=e.clientX}});
  window.addEventListener("pointerup",()=>arrasto=null,{once:false});

  // Peças em 3D (modelos do Blender) por cima da câmara; se não houver WebGL ficam os desenhos 2D
  if(window.RA3D){const tres=$("tres");
    RA3D.procura(tres,faltam,FOV).then(c=>{if(!tres.isConnected)return c.parar();cam.cena3d=c;$("mundo").classList.add("tem3d")}).catch(()=>{});}
  const els=[...document.querySelectorAll(".peca-ra")];
  els.forEach(el=>el.onclick=()=>{if(el.classList.contains("encontrada"))recolher(el.dataset.id)});

  // "Fixar": ver a peça sem continuar a apontar (lição 3 da PL 7)
  $("bfixar").onclick=()=>{
    if(fixado){fixado=null;$("bfixar").innerHTML=I("pino")+"Fixar";return}
    fixado=encontrada;$("bfixar").innerHTML=I("camara")+"Câmara";
  };
  $("bmenu").onclick=menuJogo;
  $("bmontar").onclick=()=>passar("monta",montar);
  $("bexemplo").onclick=()=>{reg("ajuda",{onde:"procurar"});demoRecolher(faltam[0].id)};
  if(!J.viuDemoRecolher){J.viuDemoRecolher=true;guardar();setTimeout(()=>{if($("cam"))demoRecolher(faltam[0].id)},500)}
  // WebXR: só aparece em aparelhos que o suportam (Android com ARCore, em https)
  const mostrarXR=()=>{const b=document.getElementById("bxr");if(b&&window.RA3D&&RA3D.xr)b.hidden=false};
  mostrarXR();window.addEventListener("ra3d-xr",mostrarXR,{once:true});
  $("bxr").onclick=()=>{J.xr=true;guardar();iniciarXR()};

  let desde=0;
  function quadro(){
    cam.raf=requestAnimationFrame(quadro);
    if(!fixado)rumo+=norm(alvoRumo-rumo)*.25;
    pano.style.backgroundPositionX=(-rumo*12)+"px";
    let melhor=null,md=999;
    for(const el of els){
      const p=PECAS.find(x=>x.id===el.dataset.id);
      let d=norm(p.az-rumo);
      if(fixado===p.id)d=0;
      const visivel=Math.abs(d)<FOV/2+12;
      el.style.display=visivel?"flex":"none";
      if(visivel)el.style.left=(50+d/FOV*100)+"%";
      if(Math.abs(d)<md){md=Math.abs(d);melhor={p,d,el}}
    }
    if(!melhor)return;
    // radar: só a peça mais próxima
    const r=2.3, ang=melhor.d*Math.PI/180;
    alvo.style.transform=`translate(${Math.sin(ang)*r}rem,${-Math.cos(ang)*r}rem)`;
    perto=Math.max(0,1-md/120);
    calor.style.width=(perto*100)+"%";
    // encontrar: a peça fica no centro durante meio segundo (interacção 2)
    if(md<9){ if(!desde)desde=performance.now(); }else desde=0;
    const achou=desde&&performance.now()-desde>450 || fixado===melhor.p.id;
    els.forEach(el=>el.classList.toggle("encontrada",achou&&el===melhor.el));
    if(achou&&encontrada!==melhor.p.id){encontrada=melhor.p.id;som("encontrar");vibrar([90,50,90]);$("bfixar").hidden=false}
    if(!achou&&encontrada&&!fixado){encontrada=null;$("bfixar").hidden=true}
    let t,cls="";
    if(achou){t="Encontraste! Toca na peça";cls="quente"}
    else if(md<30){t="Mais perto!";cls="quente"}
    else if(md<70)t=melhor.d>0?"Mais perto! Vira à direita →":"← Mais perto! Vira à esquerda";
    else t=melhor.d>0?"Vira à direita →":"← Vira à esquerda";
    sinais($("pegadas"),$("seta"),achou?null:md<20?"frente":melhor.d>0?"dir":"esq");
    if(t!==ultimaDica){dica.textContent=t;dica.className="dica "+cls;ultimaDica=t}
    if(cam.cena3d)cam.cena3d.desenhar(rumo,encontrada,fixado);
  }
  quadro();
  // quente/frio: vibra mais vezes quando a peça está perto (C1)
  let conta=0;
  cam.tick=setInterval(()=>{
    if(encontrada)return;
    conta+=100;
    const periodo=perto>.85?300:perto>.6?650:perto>.35?1200:0;
    if(periodo&&conta>=periodo){conta=0;vibrar(35)}
  },100);
}

// Pegadas e setas: significante de direcção (para onde virar/andar)
function sinais(peg,seta,dir){
  if(!peg||peg.dataset.d===String(dir))return;

  peg.className="pegadas "+(dir||"oculta");
  seta.className="seta-lado "+(dir==="dir"||dir==="esq"?dir:"oculta");

/* ---------------- RA no chão (WebXR + hit-test) ---------------- */
function iniciarXR(){
  pararCamara();reg("xr");
  const faltam=PECAS.filter(p=>!J.pecas[p.id].recolhida);
  app.innerHTML=`<main class="passa"><div class="ic-grande">${I("cubo")}</div><h2>A abrir a RA…</h2></main>`;
  const ov=document.createElement("div");ov.className="xr-ov";
  ov.innerHTML=`<div class="info-topo"><span class="pill">${I("mochila")}${contar("recolhida")}/${PECAS.length}</span>${etiquetaPapel("aponta")}
      <div class="calor" aria-hidden="true"><i id="xcalor"></i></div></div>
    <div class="radar" aria-hidden="true" id="xradar" hidden><div class="eu"></div><div class="alvo" id="xalvo"></div></div>
    <div class="seta-lado oculta" id="xseta" aria-hidden="true">${I("seta2")}</div>
    <div class="pegadas oculta" id="xpeg" aria-hidden="true">${PEGADAS}</div>
    <div class="dica" id="xdica" role="status" aria-live="polite">Aponta para o chão e move o telemóvel devagar…</div>
    <div class="fundo-cam"><button id="xsair">${I("fechar")}Sair da RA</button></div>`;
  document.body.appendChild(ov);
  // os toques nos botões não contam como "toque no ecrã" da RA
  ov.querySelectorAll("button").forEach(b=>b.addEventListener("beforexrselect",e=>e.preventDefault()));
  const $=id=>ov.querySelector("#"+id);
  let sessao=null, achada=null, ultima="", ultimaEnc=null, ultimaVib=0;
  $("xsair").onclick=()=>{sessao&&sessao.terminar()};
  const dica=(t,cls="")=>{if(t!==ultima){const d=$("xdica");d.textContent=t;d.className="dica "+cls;ultima=t}};
  RA3D.sessaoXR(faltam,ov,{
    estado(s){
      if(s.fase==="chao"){dica(s.chao?"Toca no ecrã para pousar as peças aqui":"Aponta para o chão e move o telemóvel devagar…",s.chao?"quente":"");return}
      $("xradar").hidden=false;
      const r=2.3,a=s.diff*Math.PI/180;
      $("xalvo").style.transform=`translate(${Math.sin(a)*r}rem,${-Math.cos(a)*r}rem)`;
      $("xcalor").style.width=(s.perto*100)+"%";
      if(s.encontrada&&s.encontrada!==ultimaEnc){som("encontrar");vibrar([90,50,90])}
      ultimaEnc=s.encontrada;
      const m=s.dist!=null?` · ${s.dist.toFixed(1).replace(".",",")} m`:"";
      sinais($("xpeg"),$("xseta"),s.encontrada?null:Math.abs(s.diff)<20?"frente":s.diff>0?"dir":"esq");
      if(s.encontrada)dica("Encontraste! Toca no ecrã","quente");
      else if(Math.abs(s.diff)<20&&s.dist>s.alcance)dica("Anda em frente, segue as pegadas"+m,"quente");
      else if(Math.abs(s.diff)<35&&s.dist<=s.alcance)dica("Estás perto! Olha para a peça","quente");
      else if(Math.abs(s.diff)<30)dica("Mais perto!"+m,"quente");
      else if(Math.abs(s.diff)<70)dica(s.diff>0?"Mais perto! Vira à direita →":"← Mais perto! Vira à esquerda");
      else dica(s.diff>0?"Vira à direita →":"← Vira à esquerda");
      // quente/frio por vibração
      const periodo=s.encontrada?0:s.perto>.85?300:s.perto>.6?650:s.perto>.35?1200:0, agora=performance.now();
      if(periodo&&agora-ultimaVib>periodo){ultimaVib=agora;vibrar(35)}
    },
    encontrar(id){achada=id},
    sair(motivo){
      ov.remove();
      if(motivo!=="encontrou"){J.xr=false;guardar()} // saiu: volta ao modo por orientação
      if(achada)recolher(achada);else procurar();
    },
  },{escala:J.espaco==="pequeno"?.5:1}).then(s=>{sessao=s}).catch(()=>{
    ov.remove();J.xr=false;guardar();
    toast("Não foi possível abrir a RA no chão. A usar o modo normal.");
    procurar();
  });
}

function montar(){
  pararCamara();
  const naMochila=PECAS.filter(p=>J.pecas[p.id].recolhida&&!J.pecas[p.id].colocada);
  const faltam=PECAS.length-contar("recolhida");
  app.innerHTML=`<main class="ecra">
    <div class="barra-topo"><span class="pill">${I("grelha")}${contar("colocada")}/${PECAS.length} no lugar</span>${etiquetaPapel("monta")}</div>
    <h2>${N.monta}</h2>
    <p class="nota">${N.notaTab}</p>
    <div class="legenda-ic" aria-hidden="true"><span>Arrasta para o lugar</span><span>Toca para rodar</span><span style="border-color:var(--ok);color:var(--ok)">Verde = pronta</span></div>
    <div class="tabuleiro" id="tab">${fundoTab()}
      ${PECAS.map(p=>{const c=J.pecas[p.id].colocada;return `<div class="slot ${c?"":"vazio"}" data-slot="${p.id}" style="${posSlot(p.slot,p.z)}">${svgPeca(p.id,"cima")}</div>`}).join("")}
    </div>
    <h3 style="display:flex;align-items:center;gap:.4rem">${I("mochila")}Mochila</h3>
    <div class="mochila">
      ${naMochila.map(p=>`<div class="mpeca ${J.pecas[p.id].rot===0?"pronta":""}" data-id="${p.id}" role="button" tabindex="0" aria-label="${esc(p.nome)}. ${J.pecas[p.id].rot===0?"Pronta: arrasta para encaixar.":"Toca para rodar."}"><div style="width:100%;height:100%;transform:rotate(${J.pecas[p.id].rot}deg);transition:transform .2s">${svgPeca(p.id,"cima")}</div><small>${I(J.pecas[p.id].rot===0?"visto":"rodar")}</small></div>`).join("")}
      ${[...Array(faltam)].map(()=>`<div class="mpeca bloq" aria-label="Peça por encontrar">?</div>`).join("")}
    </div>
    ${!naMochila.length&&faltam?`<p class="caixa amarela">A mochila está vazia. Ainda faltam <b>${faltam}</b> peças para encontrar.</p>`:""}
    <div class="linha" style="margin-top:1rem">
      <button id="bmenu">${I("pausa")}Pausa</button>
      ${naMochila.length?`<button id="bdica">${I("dica")}Dica</button>`:""}
      ${faltam?`<button class="prim" id="bproc">${I("radar")}Procurar (${faltam})</button>`:""}
    </div></main>`;
  document.getElementById("bmenu").onclick=menuJogo;
  J.falhas=J.falhas||{};
  if(naMochila.length){
    document.getElementById("bdica").onclick=()=>{reg("ajuda",{onde:"montar"});demoMontar()};
    // demonstração automática na primeira vez (mostrar, não só dizer)
    if(!J.viuDemo){J.viuDemo=true;guardar();setTimeout(demoMontar,700)}
  }
  if(faltam)document.getElementById("bproc").onclick=()=>passar("aponta",procurar);
  const tab=document.getElementById("tab");

  document.querySelectorAll(".mpeca:not(.bloq)").forEach(el=>{
    const id=el.dataset.id, inner=el.firstElementChild;
    let ini=null, fant=null;
    const rodar=()=>{if(PECAS.find(p=>p.id===id).roda===false){toast("Esta peça não precisa de rodar: arrasta-a para o pátio.");return}
      J.pecas[id].rot=(J.pecas[id].rot+90)%360;guardar();inner.style.transform=`rotate(${J.pecas[id].rot}deg)`;som("encaixe");
      const pronta=J.pecas[id].rot===0;
      el.classList.toggle("pronta",pronta);el.querySelector("small").innerHTML=I(pronta?"visto":"rodar");
      el.setAttribute("aria-label",`${PECAS.find(p=>p.id===id).nome}. ${pronta?"Pronta: arrasta para encaixar.":"Toca para rodar."}`);
      if(pronta){vibrar(40);toast("Pronta! Agora arrasta-a para a forma igual.")}};
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();rodar()}});
    el.addEventListener("pointerdown",e=>{ini={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)});
    el.addEventListener("pointermove",e=>{
      if(!ini)return;
      if(!fant&&Math.hypot(e.clientX-ini.x,e.clientY-ini.y)>10){
        const s=PECAS.find(p=>p.id===id).slot, W=tab.getBoundingClientRect().width;
        fant=document.createElement("div");fant.className="fantasma";
        // no mínimo 3 rem, para se ver a peça debaixo do dedo
        const k=Math.max(1,48/Math.min(s.w/TAB.w*W,s.h/TAB.w*W));
        fant.style.width=(s.w/TAB.w*W*k)+"px";fant.style.height=(s.h/TAB.w*W*k)+"px";
        fant.style.transform=`translate(-50%,-50%) rotate(${J.pecas[id].rot}deg)`;
        fant.innerHTML=svgPeca(id,"cima");document.body.appendChild(fant);el.style.opacity=.3;
        // ajuda progressiva: depois de 2 tentativas falhadas, o lugar certo pisca
        if((J.falhas[id]||0)>=2)tab.querySelector(`[data-slot="${id}"]`).classList.add("alvo");
      }
      if(fant){fant.style.left=e.clientX+"px";fant.style.top=e.clientY+"px";
        // retroacção do "íman": verde se encaixa, vermelho se está perto mas de lado
        const sl=tab.querySelector(`[data-slot="${id}"]`),r=sl.getBoundingClientRect();
        const perto=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<Math.max(40,Math.min(r.width,r.height)*.6);
        sl.classList.toggle("iman",perto&&J.pecas[id].rot===0);sl.classList.toggle("quase",perto&&J.pecas[id].rot!==0);
      }
    });
    const falhou=()=>{J.falhas[id]=(J.falhas[id]||0)+1;guardar();
      if(J.falhas[id]===2)setTimeout(()=>toast("Na próxima vez, o lugar certo vai piscar."),2300)};
    const largar=e=>{
      if(!ini)return; ini=null;
      if(!fant){rodar();return}
      fant.remove();fant=null;el.style.opacity=1;
      tab.querySelectorAll(".slot").forEach(x=>x.classList.remove("iman","quase","alvo"));
      const slot=tab.querySelector(`[data-slot="${id}"]`).getBoundingClientRect();
      const cx=slot.left+slot.width/2, cy=slot.top+slot.height/2;
      // "íman": encaixa se largada perto do lugar (≈1 cm ou metade da peça)
      const raio=Math.max(40,Math.min(slot.width,slot.height)*.6);
      const perto=Math.hypot(e.clientX-cx,e.clientY-cy)<raio;
      if(!perto){
        // largou noutro lugar: diz se está em cima de outro molde
        const outro=[...tab.querySelectorAll(".slot.vazio")].find(s=>{const r=s.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom});
        toast(outro?"Esse lugar é de outra peça. Procura a forma igual!":"A peça voltou à mochila. Larga-a em cima da forma igual.");
        reg("encaixe_falhado",{id,motivo:outro?"lugar_errado":"longe"});falhou();
        return;
      }
      if(J.pecas[id].rot!==0){toast("Quase! Está ao contrário — toca na peça para a rodar.");vibrar(150);reg("encaixe_falhado",{id,motivo:"rodada"});falhou();return}
      J.pecas[id].colocada=true;guardar();som("encaixe");vibrar(60);reg("encaixe",{id});
      if(contar("colocada")===PECAS.length)return fim();
      montar();
      const sl=document.querySelector(`[data-slot="${id}"]`);sl&&sl.classList.add("encaixa");
      toast("Encaixou! "+contar("colocada")+"/"+PECAS.length);
    };
    el.addEventListener("pointerup",largar);
    el.addEventListener("pointercancel",()=>{ini=null;if(fant){fant.remove();fant=null;el.style.opacity=1}});
  });
}

// Demonstração: uma mão leva a primeira peça da mochila até ao seu lugar (roda-a primeiro, se preciso)

  const P=(x,y,rot)=>`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${rot}deg)`;
  const ax=a.left+a.width/2, ay=a.top+a.height/2, bx=b.left+b.width/2, by=b.top+b.height/2;
  const anim=d.animate([
    {transform:P(ax,ay,r),opacity:0},{transform:P(ax,ay,r),opacity:1,offset:.12},
    {transform:P(ax,ay,0),offset:.35},{transform:P(bx,by,0),offset:.85},{transform:P(bx,by,0),opacity:0}],
    {duration:2600,iterations:2,easing:"ease-in-out"});
  anim.onfinish=()=>{d.remove();sl.classList.remove("alvo")};
}

/* ---------------- Fim e resultado ---------------- */
function linhaResultado(){
  const certas=contar("certa"), min=Math.round((Date.now()-J.inicio)/60000);
  return `CH1;${J.turma||"-"};${J.equipa.join("+")};${contar("recolhida")};${certas};${PECAS.length};${contar("colocada")===PECAS.length?1:0};${min};${NIVEL}`;
}
function resumoSessao(){
  const r=J.reg||[], seg=ms=>ms==null?null:Math.round(ms/100)/10;
  const peca1=r.find(e=>e.tipo==="peca"), pecas=r.filter(e=>e.tipo==="peca"), fimE=r.find(e=>e.tipo==="fim");
  const resp=r.filter(e=>e.tipo==="resposta");
  return {id:J.inicio, nivel:NIVEL, data:new Date(J.inicio).toLocaleString("pt-PT"), turma:J.turma||"-", equipa:J.equipa.join("+"),
    jogadores:J.equipa.length, familia:!!J.familia, modo:J.modo, xr:r.some(e=>e.tipo==="xr"),
    t_primeira_peca:seg(peca1&&peca1.t), t_total:seg(fimE&&fimE.t),
    t_montar:seg(fimE&&pecas.length?fimE.t-pecas[pecas.length-1].t:null),
    certas:contar("certa"), perguntas:PECAS.length,
    t_resposta_medio:seg(resp.length?resp.reduce((s,e)=>s+e.ms,0)/resp.length:null),
    ajudas:r.filter(e=>e.tipo==="ajuda").length, encaixes_falhados:r.filter(e=>e.tipo==="encaixe_falhado").length, sus:null};
}
function guardarSessao(ses){const l=ler(CHAVE_SES,[]).filter(x=>x.id!==ses.id);l.push(ses);gravar(CHAVE_SES,l)}
function fim(){
  pararVoz();som("fim");vibrar([100,60,100,60,200]);
  if(!(J.reg||[]).some(e=>e.tipo==="fim"))reg("fim");
  guardarSessao(Object.assign(resumoSessao(),{sus:(ler(CHAVE_SES,[]).find(x=>x.id===J.inicio)||{}).sus??null}));
  const cc=conta();
  if(cc&&!J.contado){
    const nv=nivelDe(cc), certasF=contar("certa"), est=certasF===PECAS.length?3:certasF>=4?2:1;
    nv.concluido=true;nv.vezes++;nv.melhor=Math.max(nv.melhor,J.pontos);nv.estrelas=Math.max(nv.estrelas,est);
    (cc.historico=cc.historico||[]).push({data:new Date().toLocaleString("pt-PT"),certas:certasF,perguntas:PECAS.length,pontos:J.pontos,min:Math.round((Date.now()-J.inicio)/60000)});
    J.contado=true;guardar();
  }
  const certas=contar("certa"), linha=linhaResultado();
  if(!conta()){const l=ler("ch-concluidos",[]);if(!l.includes(NIVEL)){l.push(NIVEL);gravar("ch-concluidos",l)}}
  const PROX=NIVEIS[NIVEIS.indexOf(N)+1]||null;
  const res=ler(CHAVE_RES,[]); if(!res.includes(linha)){res.push(linha);gravar(CHAVE_RES,res)}
  app.innerHTML=`<main class="ecra">
    <p class="sub" style="text-align:center;margin-top:1rem">Nível ${NIVEIS.indexOf(N)+1} concluído</p>
    <h1 style="text-align:center">${N.feito}</h1>
    <p style="text-align:center;font-size:2rem;margin:.2rem 0 .8rem">${estrelas(certas===PECAS.length?3:certas>=4?2:1)}</p>
    <div class="tabuleiro vista3d" id="v3d">${fundoTab()}${PECAS.map(p=>`<div class="slot" style="${posSlot(p.slot,p.z)}">${svgPeca(p.id,"cima")}</div>`).join("")}</div>
    <p class="destaque" style="margin-top:1rem;text-align:center">${certas} de ${PECAS.length} respostas certas · ${J.pontos} pontos</p>
    <section class="caixa amarela"><h3 style="margin-top:0">Três coisas para lembrar</h3>
      <ol style="font-size:1.1rem;margin:0;padding-left:1.3rem">${N.lembrar.map(l=>`<li>${l}</li>`).join("")}</ol></section>
    ${PROX?`<button class="prim larga grande" id="prox">${I("play")}Próximo nível: ${PROX.nome}</button>
      <button class="larga" id="ini">${I("casa")}Início</button>`
      :`<button class="prim larga grande" id="ini">${I("casa")}Continuar</button>`}
    <button class="larga" id="prof">${I("partilhar")}Enviar o resultado à professora</button>
    <button class="larga" id="sus">${I("formulario")}Responder ao questionário (2 min)</button>
    <div class="linha"><button id="part">${I("partilhar")}Partilhar</button><button id="novo">${I("reiniciar")}Jogar outra vez</button></div></main>`;
  if(window.RA3D){const v=document.getElementById("v3d");
    RA3D.visualizador(v,PECAS.map(p=>p.id),{montado:true}).then(()=>{v.querySelectorAll(".slot,.fundo").forEach(e=>e.remove());v.insertAdjacentHTML("beforeend",'<span class="dica3d">Arrasta para rodar</span>')}).catch(()=>{})}
  falar(`Parabéns! Reconstruíram a Fortaleza de São Miguel. Acertaram ${certas} de ${PECAS.length} perguntas.`);
  document.getElementById("prof").onclick=()=>partilhar(`Caçadores da História — ${MONUMENTO.nome}\n${J.equipa.join(", ")}: ${certas}/${PECAS.length} certas.\nCódigo do resultado (colar no resumo da turma):\n${linha}`);
  document.getElementById("part").onclick=()=>partilhar(`Reconstruímos a ${MONUMENTO.nome} no jogo Caçadores da História! ${certas}/${PECAS.length} respostas certas.`);
  document.getElementById("sus").onclick=questionarioSUS;
  if(PROX)document.getElementById("prox").onclick=()=>{irNivel(PROX.id);toast(`Nível ${NIVEIS.indexOf(PROX)+1} desbloqueado: ${PROX.nome}`);J?retomar():configurar()};
  document.getElementById("novo").onclick=()=>{J=null;guardar();configurar()};
  document.getElementById("ini").onclick=()=>{J=null;guardar();if(PROX)irNivel(PROX.id);inicio()};
}

/* ---------------- Questionário SUS (System Usability Scale), para a meta "SUS ≥ 70" ---------------- */
const SUS=["Acho que gostaria de jogar este jogo muitas vezes.","Achei o jogo desnecessariamente complicado.","Achei o jogo fácil de usar.",
  "Acho que precisaria da ajuda de alguém que percebe de tecnologia para jogar.","Achei que as partes do jogo (procurar, responder, montar) estavam bem ligadas.",
  "Achei que havia coisas no jogo que não faziam sentido umas com as outras.","Acho que a maioria das pessoas aprenderia a jogar muito depressa.",
  "Achei o jogo muito difícil de usar.","Senti-me confiante a jogar.","Tive de aprender muitas coisas antes de conseguir jogar."];
function questionarioSUS(){
  pararVoz();
  const resp=Array(10).fill(0);
  app.innerHTML=`<main class="ecra">
    <h2>Questionário (2 minutos)</h2>
    <p class="nota">1 = discordo totalmente · 5 = concordo totalmente. Não há respostas certas nem erradas.</p>
    ${SUS.map((q,i)=>`<div class="caixa"><p style="margin-top:0"><b>${i+1}.</b> ${esc(q)}</p>
      <div class="escala" role="group" aria-label="Resposta ${i+1}">${[1,2,3,4,5].map(v=>`<button data-q="${i}" data-v="${v}" aria-pressed="false">${v}</button>`).join("")}</div>
      <div class="linha nota" style="justify-content:space-between"><span>Discordo</span><span style="text-align:right">Concordo</span></div></div>`).join("")}
    <button class="prim larga" id="env" disabled>Enviar</button>
    <button class="larga" id="vt">Voltar sem responder</button></main>`;
  const env=document.getElementById("env");
  document.querySelectorAll(".escala button").forEach(b=>b.onclick=()=>{
    const q=+b.dataset.q;resp[q]=+b.dataset.v;
    b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    env.disabled=resp.some(v=>!v);
  });
  document.getElementById("vt").onclick=fim;
  env.onclick=()=>{
    // ímpares: resposta − 1; pares: 5 − resposta; soma × 2,5 → 0 a 100
    const nota=resp.reduce((s,v,i)=>s+(i%2===0?v-1:5-v),0)*2.5;
    const ses=Object.assign(resumoSessao(),{sus:nota});guardarSessao(ses);reg("sus",{nota});
    app.innerHTML=`<main class="passa"><div class="ic-grande">${I("visto")}</div><h2>Obrigado!</h2>
      <p>As respostas ficam guardadas neste telemóvel, sem nomes.</p><button class="prim larga" id="ok">Continuar</button></main>`;
    document.getElementById("ok").onclick=fim;
  };
}
function partilhar(texto){
  if(navigator.share){navigator.share({text:texto}).catch(()=>{});return}
  const url="https://wa.me/?text="+encodeURIComponent(texto);
  if(navigator.clipboard)navigator.clipboard.writeText(texto).then(()=>toast("Texto copiado. A abrir o WhatsApp…")).catch(()=>{});
  window.open(url,"_blank","noopener");
}

function linkTurma(cod){return location.origin+location.pathname+"?turma="+encodeURIComponent(cod)+"&nivel="+NIVEL}
function mostrarTurma(cod){

  app.innerHTML=`<main class="ecra" style="text-align:center"><h2>Código da turma</h2>
    <p class="codigo">${esc(cod)}</p>
    ${qr?`<div class="qr" role="img" aria-label="QR que abre o jogo com o código ${esc(cod)}">${qr}</div><p>Os alunos lêem o QR com a câmara: o jogo abre já com o código.</p>`:`<p>Os alunos escrevem este código no ecrã "Novo jogo".</p>`}
    <button class="prim larga" id="env">${I("partilhar")}Enviar à turma</button><button class="larga" id="ok">Feito</button></main>`;
  document.getElementById("env").onclick=()=>partilhar(`Visita à ${MONUMENTO.nome}: abram este link com Wi-Fi antes de sair (depois funciona sem internet): ${linkTurma(cod)} — código da turma ${cod}.`);
  document.getElementById("ok").onclick=professora;
}

/* ---------------- Dados dos testes (PL 14), comparados com as metas da secção 5.3 ---------------- */
function dadosTestes(){
  const L=ler(CHAVE_SES,[]);
  const pct=(a,b)=>b?Math.round(a/b*100)+" %":"—";
  const comT1=L.filter(s=>s.t_primeira_peca!=null), okT1=comT1.filter(s=>s.t_primeira_peca<=120).length;
  const equipas=L.filter(s=>s.jogadores>=2&&!s.familia&&s.t_montar!=null), okM=equipas.filter(s=>s.t_montar<=900&&s.ajudas<=1).length;
  const sus=L.filter(s=>s.sus!=null), susM=sus.length?sus.reduce((a,s)=>a+s.sus,0)/sus.length:null;
  const certas=L.reduce((a,s)=>a+s.certas,0), perg=L.reduce((a,s)=>a+s.perguntas,0);
  const meta=(ok,txt)=>`<span class="${ok==null?"":ok?"ok":"nok"}">${txt}</span>`;
  app.innerHTML=`<main class="ecra">
    ${barraApp("Dados dos testes (PL 14)")}
    <p>${L.length} jogo(s) terminado(s) neste telemóvel.</p>
    <table><thead><tr><th>Meta (secção 5.3)</th><th>Resultado</th></tr></thead><tbody>
      <tr><td>1.ª peça em ≤ 2 min (meta ≥ 90 %)</td><td>${meta(comT1.length?okT1/comT1.length>=.9:null,`${pct(okT1,comT1.length)} (${okT1}/${comT1.length})`)}</td></tr>
      <tr><td>Equipas montam em ≤ 15 min com ≤ 1 ajuda no jogo (meta ≥ 80 %)</td><td>${meta(equipas.length?okM/equipas.length>=.8:null,`${pct(okM,equipas.length)} (${okM}/${equipas.length})`)}</td></tr>
      <tr><td>SUS médio (meta ≥ 70)</td><td>${meta(susM==null?null:susM>=70,susM==null?"—":susM.toFixed(1)+` (${sus.length} resp.)`)}</td></tr>
      <tr><td>Respostas certas (informativo)</td><td>${pct(certas,perg)}</td></tr>
    </tbody></table>
    <p class="nota">"Ajuda no jogo" = abrir "Como se joga" no menu. Os pedidos de ajuda a pessoas e a meta 2 (saber se acertou) continuam a medir-se por observação. Tarefa 1 sem ajuda: confirmar com a folha de observação.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Equipa</th><th>1.ª peça (s)</th><th>Montar (s)</th><th>Total (s)</th><th>Certas</th><th>Ajudas</th><th>Falhas encaixe</th><th>SUS</th></tr></thead><tbody>
    ${L.map(s=>`<tr><td>${esc(s.data)}</td><td>${esc(s.equipa.replace(/\+/g,", "))}${s.familia?" (família)":""}${s.xr?" (RA)":""}</td><td>${s.t_primeira_peca??"—"}</td><td>${s.t_montar??"—"}</td><td>${s.t_total??"—"}</td><td>${s.certas}/${s.perguntas}</td><td>${s.ajudas}</td><td>${s.encaixes_falhados}</td><td>${s.sus??"—"}</td></tr>`).join("")}
    </tbody></table></div>
    <button class="prim larga" id="csv" ${L.length?"":"disabled"}>${I("descarregar")}Descarregar CSV</button>
    <button class="larga" id="apagar" ${L.length?"":"disabled"}>${I("lixo")}Apagar os dados dos testes</button></main>`;
  document.getElementById("volta").onclick=professora;
  document.getElementById("csv").onclick=()=>{
    const cols=["nivel","data","turma","equipa","jogadores","familia","modo","xr","t_primeira_peca","t_montar","t_total","certas","perguntas","t_resposta_medio","ajudas","encaixes_falhados","sus"];
    const csv=[cols.join(";"),...L.map(s=>cols.map(c=>{const v=s[c]??"";return /[;"\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:String(v).replace(".",",")}).join(";"))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    a.download="cacadores_testes_pl14.csv";document.body.appendChild(a);a.click();a.remove();
  };
  const ap=document.getElementById("apagar");
  ap.onclick=()=>{if(ap.dataset.c){gravar(CHAVE_SES,[]);dadosTestes()}else{ap.dataset.c=1;ap.textContent="Tem a certeza? Toque outra vez para apagar"}};
}

/* ---------------- Diagnóstico do aparelho (para o teste no Android) ---------------- */
function diagnostico(){
  pararCamara();pararVoz();
  app.innerHTML=`<main class="ecra">
    ${barraApp("Verificar este telemóvel")}
    <p>Testa a câmara, o giroscópio, a RA, a voz e o modo offline. Leva cerca de 10 segundos. Se o telemóvel pedir autorização, toque em <b>Permitir</b>.</p>
    <button class="prim larga grande" id="ir">${I("play")}Começar a verificação</button>
    <div id="res"></div></main>`;
  document.getElementById("volta").onclick=inicio;
  document.getElementById("ir").onclick=async()=>{
    const R=document.getElementById("res"), linhas=[];
    document.getElementById("ir").disabled=true;
    const vis=[];
    const add=(ok,nome,det="")=>{const e=ok===true?"OK":ok===false?"FALHA":"INFO";linhas.push(`[${e}] ${nome}${det?": "+det:""}`);
      vis.push(`<p style="margin:.45rem 0"><span class="estado ${ok===true?"s":ok===false?"n":"a"}">${e}</span><b>${esc(nome)}</b>${det?`<br><span class="nota">${esc(det)}</span>`:""}</p>`);
      R.innerHTML=`<div class="caixa">${vis.join("")}</div>`};
    const ua=navigator.userAgent, and=(ua.match(/Android [\d.]+/)||["—"])[0], chr=(ua.match(/Chrome\/(\d+)/)||[,"—"])[1];
    add(null,"Aparelho",`${and} · Chrome ${chr} · ecrã ${screen.width}×${screen.height} (×${devicePixelRatio})`);
    add(window.isSecureContext,"Ligação segura (https)",window.isSecureContext?"sim":"não — a câmara e a RA não funcionam");
    // câmara
    try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      const t=st.getVideoTracks()[0], c=t.getSettings();add(true,"Câmara traseira",`${c.width||"?"}×${c.height||"?"}`);st.getTracks().forEach(x=>x.stop())}
    catch(e){add(false,"Câmara",e.name==="NotAllowedError"?"autorização negada":e.name||"indisponível")}
    // giroscópio / bússola
    try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function")await DeviceOrientationEvent.requestPermission()}catch(e){}
    const ori=await new Promise(res=>{let n=0,bus=false;const h=e=>{if(e.alpha!=null){n++;if(typeof e.webkitCompassHeading==="number"||e.absolute)bus=true}};
      window.addEventListener("deviceorientation",h);setTimeout(()=>{window.removeEventListener("deviceorientation",h);res({n,bus})},2000)});
    add(ori.n>0,"Giroscópio (rodar para procurar)",ori.n>0?`${ori.n} leituras em 2 s${ori.bus?" · com bússola":""}`:"sem leituras — o jogo usa as setas no ecrã");
    // WebGL e WebXR
    let gl=false;try{const c=document.createElement("canvas");gl=!!(c.getContext("webgl2")||c.getContext("webgl"))}catch(e){}
    add(gl,"Peças em 3D (WebGL)",gl?"sim":"não — o jogo usa as imagens 2D");
    let xr=false;try{xr=!!(navigator.xr&&await navigator.xr.isSessionSupported("immersive-ar"))}catch(e){}
    add(xr?true:null,"RA no chão (WebXR / ARCore)",xr?"sim — aparece o botão RA no chão":"não — fica a RA por orientação");
    // voz
    let vozes=speechSynthesis?speechSynthesis.getVoices():[];
    if(!vozes.length&&window.speechSynthesis)vozes=await new Promise(r=>{speechSynthesis.onvoiceschanged=()=>r(speechSynthesis.getVoices());setTimeout(()=>r(speechSynthesis.getVoices()),1500)});
    const pt=vozes.filter(v=>/^pt/i.test(v.lang)), ptl=pt.filter(v=>v.localService);
    add(pt.length?(ptl.length?true:null):false,"Voz em português",pt.length?`${pt.length} voz(es) (${[...new Set(pt.map(v=>v.lang))].join(", ")})${ptl.length?" · funciona sem internet":" · pode precisar de internet"}`:"nenhuma — instalar em Definições → Texto para voz");
    if(pt.length&&DEF.voz)falar("Olá! Esta é a voz do jogo Caçadores da História.");
    // vibração, bateria, armazenamento, offline
    add(!!navigator.vibrate?true:null,"Vibração",navigator.vibrate?"sim (deve ter sentido agora)":"não suportada");vibrar([150,80,150]);
    try{const b=await navigator.getBattery();add(null,"Bateria",`${Math.round(b.level*100)} %${b.charging?" (a carregar)":""}`)}catch(e){}
    let ls=false;try{localStorage.setItem("ch-t","1");localStorage.removeItem("ch-t");ls=true}catch(e){}
    add(ls,"Guardar o progresso",ls?"sim":"não — o jogo não fica guardado");
    let off=false,n=0;try{const ks=await caches.keys();for(const k of ks)n+=(await (await caches.open(k)).keys()).length;off=!!navigator.serviceWorker.controller&&n>0}catch(e){}
    add(off?true:null,"Jogar sem internet",off?`pronto (${n} ficheiros guardados)`:"ainda não — abra o jogo outra vez com internet");
    add(null,"Aplicação instalada",matchMedia("(display-mode: standalone)").matches?"sim":"não (menu do Chrome → Instalar aplicação)");
    R.insertAdjacentHTML("beforeend",`<button class="prim larga" id="part">${I("partilhar")}Partilhar o resultado</button>`);
    document.getElementById("part").onclick=()=>partilhar("Caçadores da História — verificação do telemóvel\n"+linhas.join("\n"));
  };
}

/* ---------------- Arranque ---------------- */
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if("speechSynthesis" in window)speechSynthesis.getVoices();
inicio();
if(TURMA_URL)toast("Turma "+TURMA_URL+": toca em Jogar para começar.",4000);
</script>
